  {% include "partials/favicon.html" %}
  <title>{{ seo_title|default:"Animee.uz" }}</title>
  <meta name="description" content="{{ seo_description|default:'' }}"/>
  {% if seo_canonical %}<link rel="canonical" href="{{ seo_canonical }}"/>{% endif %}
  <link rel="search" type="application/opensearchdescription+xml" title="Animee" href="{% url 'opensearch' %}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Animee.uz"/>
  <meta property="og:title" content="{{ seo_title|default:'Animee.uz' }}"/>
  <meta property="og:description" content="{{ seo_description|default:'' }}"/>
  {% if seo_canonical %}<meta property="og:url" content="{{ seo_canonical }}"/>{% endif %}
  {% if seo_image %}<meta property="og:image" content="{{ seo_image }}"/>{% endif %}
  <meta name="twitter:card" content="summary_large_image"/>
  {% if seo_json_ld %}
  <script type="application/ld+json">{{ seo_json_ld|safe }}</script>
  {% endif %}
