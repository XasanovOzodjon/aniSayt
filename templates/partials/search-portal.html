<div class="search-portal" id="searchPortal" hidden>
  <button type="button" class="search-portal-close" data-close-search aria-label="Yopish">✕</button>
  <div class="search-portal-rings" aria-hidden="true"></div>
  <div class="search-portal-rings search-portal-rings-2" aria-hidden="true"></div>
  <div class="search-portal-kanji" aria-hidden="true">索</div>
  <div class="search-portal-core">
    <h2 class="search-portal-title">Nimani izlayapsiz?</h2>
    <div class="search-portal-field">
      <span class="search-portal-orb"></span>
      <input id="searchPortalInput" type="search" autocomplete="off" placeholder="Qidirish"/>
    </div>
    <div class="search-chips" id="searchScopes">
      <button type="button" data-search-scope="all" aria-pressed="true">All</button>
      <button type="button" data-search-scope="users">Users</button>
      <button type="button" data-search-scope="anime">Anime</button>
      <button type="button" data-search-scope="film">Kino</button>
      <button type="button" data-search-scope="serial">Serial</button>
      <button type="button" data-search-scope="drama">Drama</button>
    </div>
    <div class="search-portal-results" id="searchPortalResults"></div>
  </div>
</div>
