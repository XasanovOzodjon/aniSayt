services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49190:49160-49190/udp"
    environment:
      TURN_USERNAME: ${TURN_USERNAME:-animee}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-changeme}
      TURN_REALM: ${TURN_REALM:-animee.uz}
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - "--user=${TURN_USERNAME:-animee}:${TURN_CREDENTIAL:-changeme}"
      - "--realm=${TURN_REALM:-animee.uz}"
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49190
      - --listening-ip=0.0.0.0

volumes:
  redisdata:
